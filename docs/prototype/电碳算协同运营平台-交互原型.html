<!--
  用途：电碳算协同运营平台 — 投标用纯 HTML 交互原型
  打开方式：双击本文件，或在浏览器中打开 file:///.../电碳算协同运营平台-交互原型.html
  技术：单文件，内联 CSS/JS，无外链 CDN；hash 路由如 #/login、#/service/product
  覆盖模块：
    认证(4)：登录、注册、个人/企业认证
    首页(1)：门户首页（全宽轮播，无左侧菜单）
    门户服务(14)：产品/下单/模型/案例、算力供给/产品、我的应用/算力需求/运行管理
    我的(5)：个人信息、登录日志、意见反馈、收藏、消息
    管理(6)：设备、企业信息/子账号/统计、首页内容/算力产品管理
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>电碳算协同运营平台 - 交互原型</title>
<style>
:root{--primary:#6b4cff;--primary-light:#ede9ff;--primary-dark:#5538e0;--bg:#f8f9fc;--card:#fff;--text:#1a1a2e;--text2:#606266;--text3:#909399;--border:#e4e7ed;--success:#67c23a;--warning:#e6a23c;--danger:#f56c6c;--info:#909399;--radius:12px;--shadow:0 2px 12px rgba(107,76,255,.08);--sidebar-w:220px;--header-h:56px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
a{color:var(--primary);text-decoration:none;cursor:pointer}
button,input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}
/* 页面导览 */
.proto-nav{position:fixed;right:16px;bottom:16px;z-index:9000}
.proto-nav__btn{width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(107,76,255,.4);font-size:20px}
.proto-nav__panel{position:absolute;bottom:56px;right:0;width:320px;max-height:70vh;overflow:auto;background:var(--card);border-radius:var(--radius);box-shadow:0 8px 32px rgba(0,0,0,.15);padding:12px;display:none}
.proto-nav__panel.open{display:block}
.proto-nav__group{margin-bottom:10px}
.proto-nav__group h4{font-size:12px;color:var(--text3);margin-bottom:4px;padding-left:4px}
.proto-nav__link{display:block;padding:4px 8px;border-radius:6px;font-size:12px;color:var(--text2);cursor:pointer}
.proto-nav__link:hover,.proto-nav__link.active{background:var(--primary-light);color:var(--primary)}
/* 顶栏 */
.header{height:var(--header-h);background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:100;gap:16px}
.header__logo{font-size:16px;font-weight:700;color:var(--primary);white-space:nowrap;cursor:pointer}
.header__tabs{display:flex;gap:4px}
.header__tab{padding:8px 16px;border-radius:8px;cursor:pointer;color:var(--text2);border:none;background:none;font-size:14px}
.header__tab:hover{color:var(--primary);background:var(--primary-light)}
.header__tab.active{color:var(--primary);background:var(--primary-light);font-weight:600}
.header__search{flex:1;max-width:360px;position:relative;margin-left:auto}
.header__search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--border);border-radius:20px;background:var(--bg);outline:none}
.header__search input:focus{border-color:var(--primary)}
.header__search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px}
.header__search-drop{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--card);border-radius:8px;box-shadow:var(--shadow);display:none;z-index:200}
.header__search-drop.open{display:block}
.header__search-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px}
.header__search-item:hover{background:var(--primary-light)}
.header__actions{display:flex;align-items:center;gap:12px}
.header__bell{position:relative;cursor:pointer;font-size:18px;padding:4px}
.header__bell-dot{position:absolute;top:2px;right:2px;width:8px;height:8px;background:var(--danger);border-radius:50%}
.header__user{display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 8px;border-radius:8px;position:relative}
.header__user:hover{background:var(--bg)}
.header__user-menu{position:absolute;top:100%;right:0;margin-top:4px;background:var(--card);border-radius:8px;box-shadow:var(--shadow);min-width:140px;display:none;z-index:200}
.header__user-menu.open{display:block}
.header__user-menu-item{padding:10px 16px;cursor:pointer;font-size:13px}
.header__user-menu-item:hover{background:var(--primary-light);color:var(--primary)}
/* 布局 */
.layout{display:flex;min-height:calc(100vh - var(--header-h))}
.layout--no-sidebar .sidebar{display:none}
.layout--no-sidebar .main{padding:0;max-width:none}
.layout--home .main{padding:0;background:#fff}
.sidebar{width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);padding:12px 0;flex-shrink:0;overflow-y:auto}
.sidebar__group-title{padding:8px 16px 4px;font-size:11px;color:var(--text3);text-transform:uppercase}
.sidebar__item{display:flex;align-items:center;padding:10px 16px 10px 20px;cursor:pointer;color:var(--text2);font-size:13px;border-left:3px solid transparent;gap:8px}
.sidebar__item:hover{background:var(--bg);color:var(--primary)}
.sidebar__item.active{background:var(--primary-light);color:var(--primary);border-left-color:var(--primary);font-weight:600}
.sidebar__sub{padding-left:12px}
.sidebar__sub .sidebar__item{padding-left:32px;font-size:12px}
.main{flex:1;padding:20px;overflow-y:auto;min-width:0}
/* 认证页 */
.auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6b4cff 0%,#9b7bff 50%,#f8f9fc 100%);padding:24px}
.auth-card{width:100%;max-width:420px;background:var(--card);border-radius:16px;padding:36px 32px;box-shadow:0 8px 40px rgba(0,0,0,.12)}
.auth-card.wide{max-width:640px}
.auth-card__logo{text-align:center;margin-bottom:24px}
.auth-card__logo h1{font-size:20px;color:var(--primary);margin-top:8px}
.auth-card__logo p{font-size:12px;color:var(--text3)}
.auth-card__tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:12px}
.auth-card__tab{padding:6px 12px;cursor:pointer;color:var(--text2);border:none;background:none;border-bottom:2px solid transparent}
.auth-card__tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.auth-card__links{text-align:center;margin-top:16px;font-size:13px;color:var(--text3)}
/* 通用组件 */
.page-header{margin-bottom:20px}
.page-header__eyebrow{font-size:12px;color:var(--primary);margin-bottom:4px}
.page-header__title{font-size:22px;font-weight:700;margin-bottom:6px}
.page-header__desc{font-size:13px;color:var(--text2)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card__title{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:13px;transition:.15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn--primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn--primary:hover{background:var(--primary-dark);color:#fff}
.btn--danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn--text{border:none;background:none;color:var(--primary);padding:4px 8px}
.btn--sm{padding:4px 10px;font-size:12px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:13px;color:var(--text2);margin-bottom:4px}
.form-row label .req{color:var(--danger)}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;outline:none}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--primary)}
.form-row textarea{min-height:80px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form-grid .full{grid-column:1/-1}
.filter-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.filter-bar .form-row{margin-bottom:0;min-width:160px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--bg);color:var(--text2);font-weight:600;white-space:nowrap}
tr:hover td{background:#fafbff}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px}
.tag--success{background:#f0f9eb;color:var(--success)}
.tag--warning{background:#fdf6ec;color:var(--warning)}
.tag--danger{background:#fef0f0;color:var(--danger)}
.tag--info{background:#f4f4f5;color:var(--info)}
.tag--primary{background:var(--primary-light);color:var(--primary)}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:16px}
.pager__btn{min-width:32px;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.pager__btn:hover{border-color:var(--primary);color:var(--primary)}
.pager__btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pager__info{font-size:12px;color:var(--text3);margin-right:8px}
.switch{position:relative;width:40px;height:22px;display:inline-block;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch__slider{position:absolute;inset:0;background:#dcdfe6;border-radius:11px;transition:.2s}
.switch__slider::before{content:'';position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.switch__slider{background:var(--primary)}
.switch input:checked+.switch__slider::before{transform:translateX(18px)}
.empty{text-align:center;padding:40px;color:var(--text3)}
.empty__icon{font-size:48px;margin-bottom:8px;opacity:.4}
/* 产品/模型卡片 */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.product-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:.2s;border:1px solid transparent}
.product-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(107,76,255,.15);border-color:var(--primary-light)}
.product-card__img{height:140px;background:var(--bg);overflow:hidden}
.product-card__img img{display:block;width:100%;height:100%;object-fit:cover}
/* Banner */
/* 首页轮播（对齐真实 portal home-banner） */
.home-banner{position:relative;width:100%;height:clamp(420px,58vh,560px);min-height:420px;overflow:hidden;background:#0b1220}
.home-banner__track{display:flex;width:100%;height:100%;transition:transform .55s ease}
.home-banner__slide{position:relative;flex:0 0 100%;width:100%;height:100%;border:0;padding:0;cursor:pointer;background:transparent;overflow:hidden}
.home-banner__visual{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.home-banner__caption{position:absolute;left:clamp(24px,6vw,80px);bottom:72px;z-index:1;display:flex;flex-direction:column;gap:16px;align-items:flex-start;max-width:min(560px,78vw);text-align:left}
.home-banner__title{margin:0;font-size:clamp(28px,3.6vw,44px);font-weight:750;line-height:1.25;color:#fff;text-shadow:0 8px 28px rgba(0,0,0,.35);letter-spacing:.02em}
.home-banner__desc{margin:0;font-size:15px;line-height:1.6;color:rgba(255,255,255,.82);max-width:480px}
.home-banner__cta{display:inline-flex;align-items:center;height:40px;padding:0 18px;font-size:14px;font-weight:650;color:#0f1a2e;background:#fff;border-radius:999px;border:none;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.home-banner__cta:hover{filter:brightness(1.05)}
.home-banner__arrows{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:2}
.home-banner__arrow{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(15,26,46,.55);color:#fff;font-size:18px;cursor:pointer}
.home-banner__arrow:hover{background:rgba(15,26,46,.78)}
.home-banner__dots{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;z-index:2}
.home-banner__dot{width:28px;height:3px;border:0;border-radius:2px;padding:0;background:rgba(255,255,255,.45);cursor:pointer}
.home-banner__dot.active{background:#fff}
.home-section{padding:48px clamp(20px,4vw,48px);max-width:1280px;margin:0 auto}
.home-section__tag{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--primary-light);color:var(--primary);font-size:12px;font-weight:650;margin-bottom:8px}
.home-section__title{font-size:26px;font-weight:750;margin:0 0 8px}
.home-section__desc{color:var(--text3);margin:0 0 24px;font-size:14px}
.home-section--alt{background:var(--bg)}
.home-about__list{display:flex;flex-direction:column;gap:28px;max-width:1100px;margin:0 auto}
.home-about__block{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:center;padding:24px;background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:0 10px 28px rgba(31,36,48,.05)}
.home-about__block--reverse .home-about__media{order:2}
.home-about__block--reverse .home-about__copy{order:1}
.home-about__media{height:240px;overflow:hidden;border-radius:14px;background:var(--bg)}
.home-about__media img{display:block;width:100%;height:100%;object-fit:cover}
.home-about__name{margin:0 0 14px;font-size:22px;font-weight:800;line-height:1.35}
.home-about__content{margin:0;font-size:14px;line-height:1.85;color:var(--text3);white-space:pre-wrap}
@media(max-width:900px){.home-about__block,.home-about__block--reverse{grid-template-columns:1fr;gap:18px;padding:18px}.home-about__block--reverse .home-about__media,.home-about__block--reverse .home-about__copy{order:initial}.home-about__media{height:180px}.home-about__name{font-size:18px}}
.home-service-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.home-service-item{padding:20px;background:var(--card);border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:.2s}
.home-service-item:hover{border-color:var(--primary);box-shadow:var(--shadow);transform:translateY(-2px)}
.home-news-list{display:flex;flex-direction:column;gap:0}
.home-news-item{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer}
.home-news-item:hover .home-news-item__title{color:var(--primary)}
.home-news-item__title{font-weight:600}
.home-news-item__meta{font-size:12px;color:var(--text3);white-space:nowrap}
/* 算力下单四步 */
.order-steps{display:flex;gap:8px;margin-bottom:20px;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:14px}
.order-step{flex:1;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid transparent}
.order-step.active{background:var(--primary-light);border-color:var(--primary)}
.order-step.done{opacity:.85}
.order-step__idx{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--border);color:var(--text3);margin-right:8px}
.order-step.active .order-step__idx,.order-step.done .order-step__idx{background:var(--primary);color:#fff}
.order-step__title{font-weight:650;font-size:14px}
.order-step__desc{font-size:12px;color:var(--text3);margin-top:2px}
.order-chip-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.order-chip-label{width:72px;color:var(--text3);font-size:13px;flex-shrink:0}
.order-chip{padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px}
.order-chip.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary);font-weight:600}
.order-table tr.selected{background:var(--primary-light)}
.order-table tr{cursor:pointer}
.order-image-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.order-image-card{padding:14px;border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:.15s}
.order-image-card:hover{border-color:var(--primary)}
.order-image-card.active{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.order-image-card__name{font-weight:650;margin-bottom:6px}
.order-image-card__meta{font-size:12px;color:var(--text3)}
.order-fee{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.order-fee__item{padding:16px;background:var(--bg);border-radius:12px}
.order-fee__item--total{background:var(--primary-light)}
.order-fee__item span{display:block;font-size:12px;color:var(--text3);margin-bottom:6px}
.order-fee__item strong{font-size:20px;color:var(--primary)}
.order-footer{display:flex;justify-content:space-between;gap:12px;margin-top:16px;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:14px;position:sticky;bottom:12px}
@media(max-width:1100px){.home-service-grid,.order-image-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.order-fee{grid-template-columns:1fr}}
@media(max-width:768px){.home-service-grid,.order-image-grid{grid-template-columns:1fr}.order-steps{flex-direction:column}}
/* 详情页 */
.detail-hero{display:flex;gap:24px;margin-bottom:20px}
.product-card__body{padding:14px}
.product-card__title{font-weight:600;margin-bottom:6px;font-size:14px}
.product-card__desc{font-size:12px;color:var(--text3);margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-card__footer{display:flex;justify-content:space-between;align-items:center}
.product-card__price{color:var(--primary);font-weight:700;font-size:15px}
.home-banner__mask{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(8,14,28,.72) 0%,rgba(8,14,28,.28) 42%,rgba(8,14,28,.08) 68%,transparent 100%),linear-gradient(0deg,rgba(8,14,28,.55) 0%,transparent 42%)}
.detail-hero__img{width:200px;height:200px;border-radius:var(--radius);background:var(--bg);overflow:hidden;flex-shrink:0}
.detail-hero__img img{display:block;width:100%;height:100%;object-fit:cover}
.card img{max-width:100%}
.card > div > img[src*="picsum"]{display:block;width:100%;height:100%;object-fit:cover}
.order-image-card__cover{height:96px;border-radius:8px;overflow:hidden;margin-bottom:10px;background:var(--bg)}
.order-image-card__cover img{display:block;width:100%;height:100%;object-fit:cover}
.app-card__cover{width:100%;height:88px;border-radius:8px;overflow:hidden;margin-bottom:10px;background:var(--bg)}
.app-card__cover img{display:block;width:100%;height:100%;object-fit:cover}
.home-service-item__icon{width:48px;height:48px;border-radius:12px;overflow:hidden;margin-bottom:10px}
.home-service-item__icon img{display:block;width:100%;height:100%;object-fit:cover}
.upload-zone img{max-width:100%;max-height:120px;object-fit:cover;border-radius:8px;margin-top:8px}
.auth-card__logo-img{width:72px;height:72px;border-radius:16px;object-fit:cover;margin:0 auto 8px;display:block}
.detail-hero__info{flex:1}
.detail-hero__info h2{font-size:22px;margin-bottom:8px}
.detail-hero__meta{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0;font-size:13px;color:var(--text2)}
.detail-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px}
.detail-tab{padding:10px 20px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent}
.detail-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
/* 步骤条 */
.steps{display:flex;margin-bottom:24px;gap:0}
.step{flex:1;text-align:center;position:relative}
.step::after{content:'';position:absolute;top:14px;left:50%;width:100%;height:2px;background:var(--border);z-index:0}
.step:last-child::after{display:none}
.step__dot{width:28px;height:28px;border-radius:50%;background:var(--border);color:var(--text3);display:inline-flex;align-items:center;justify-content:center;font-size:12px;position:relative;z-index:1;margin-bottom:6px}
.step.done .step__dot,.step.active .step__dot{background:var(--primary);color:#fff}
.step__label{font-size:12px;color:var(--text3)}
.step.active .step__label,.step.done .step__label{color:var(--primary)}
/* 指标卡 */
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat-card__label{font-size:12px;color:var(--text3);margin-bottom:4px}
.stat-card__value{font-size:24px;font-weight:700;color:var(--primary)}
/* 图表占位 */
.chart-placeholder{height:240px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.chart-placeholder svg{width:100%;height:100%}
/* 应用卡片网格 */
.app-card{border:2px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;position:relative;transition:.15s}
.app-card:hover{border-color:var(--primary-light)}
.app-card.selected{border-color:var(--primary);background:var(--primary-light)}
.app-card__check{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px}
.app-card.selected .app-card__check{background:var(--primary);border-color:var(--primary);color:#fff}
.selected-bar{background:var(--primary-light);border-radius:8px;padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.selected-bar__tag{background:var(--card);padding:4px 10px;border-radius:16px;display:flex;align-items:center;gap:4px}
.selected-bar__tag span{cursor:pointer;color:var(--danger)}
/* 消息 Tab */
.msg-tabs{display:flex;gap:4px;margin-bottom:16px}
.msg-tab{padding:6px 14px;border-radius:16px;cursor:pointer;font-size:13px;color:var(--text2);border:1px solid var(--border)}
.msg-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* Toast */
.toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 20px;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15);font-size:13px;animation:toastIn .3s;display:flex;align-items:center;gap:8px;border-left:4px solid var(--success)}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:var(--radius);width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.modal.wide{max-width:720px}
.modal__header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px}
.modal__close{cursor:pointer;font-size:20px;color:var(--text3);border:none;background:none}
.modal__body{padding:20px}
.modal__footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
/* Drawer */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8000}
.drawer{position:fixed;top:0;right:0;width:480px;max-width:90vw;height:100vh;background:var(--card);box-shadow:-4px 0 24px rgba(0,0,0,.15);z-index:8001;display:flex;flex-direction:column;animation:drawerIn .25s}
@keyframes drawerIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.drawer__header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:600}
.drawer__body{flex:1;overflow:auto;padding:20px}
.drawer__footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.upload-zone{border:2px dashed var(--border);border-radius:8px;padding:32px;text-align:center;color:var(--text3);cursor:pointer;margin-top:12px}
.upload-zone:hover{border-color:var(--primary);color:var(--primary)}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 24px}
.info-item__label{font-size:12px;color:var(--text3);margin-bottom:2px}
.info-item__value{font-size:14px}
@media(max-width:768px){.sidebar{display:none}.stat-cards{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}}
</style>

<script>
// ===== 工具函数 =====
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return [...(r || document).querySelectorAll(s)]; }
function toast(msg, type) {
  const c = $('#toastContainer');
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.borderLeftColor = type === 'danger' ? '#f56c6c' : type === 'warning' ? '#e6a23c' : '#67c23a';
  el.textContent = '✓ ' + msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}
function showModal(title, bodyHtml, opts) {
  opts = opts || {};
  const root = $('#modalRoot');
  root.className = 'overlay';
  root.innerHTML = '<div class="modal' + (opts.wide ? ' wide' : '') + '"><div class="modal__header"><span>' + title + '</span><button class="modal__close" data-act="close">×</button></div><div class="modal__body">' + bodyHtml + '</div>' + (opts.footer !== false ? '<div class="modal__footer"><button class="btn" data-act="close">' + (opts.cancelText || '取消') + '</button><button class="btn btn--primary" data-act="confirm">' + (opts.confirmText || '确定') + '</button></div>' : '') + '</div>';
  root.onclick = function(e) {
    if (e.target === root || e.target.dataset.act === 'close') { root.className = 'hidden'; root.innerHTML = ''; }
    if (e.target.dataset.act === 'confirm') { if (opts.onConfirm) opts.onConfirm(); root.className = 'hidden'; root.innerHTML = ''; }
  };
}
function showDrawer(title, bodyHtml, opts) {
  opts = opts || {};
  const root = $('#drawerRoot');
  root.className = '';
  root.innerHTML = '<div class="drawer-overlay" data-act="close"></div><div class="drawer"><div class="drawer__header"><span>' + title + '</span><button class="modal__close" data-act="close">×</button></div><div class="drawer__body">' + bodyHtml + '</div>' + (opts.footer !== false ? '<div class="drawer__footer"><button class="btn" data-act="close">取消</button><button class="btn btn--primary" data-act="confirm">' + (opts.confirmText || '确定') + '</button></div>' : '') + '</div>';
  root.onclick = function(e) {
    if (e.target.dataset.act === 'close') { root.className = 'hidden'; root.innerHTML = ''; }
    if (e.target.dataset.act === 'confirm') { if (opts.onConfirm) opts.onConfirm(); root.className = 'hidden'; root.innerHTML = ''; }
  };
}
function pagerHtml(cur, total, id) {
  let h = '<div class="pager" data-pager="' + id + '"><span class="pager__info">共 ' + total + ' 条</span>';
  for (let i = 1; i <= Math.min(total, 5); i++) h += '<button class="pager__btn' + (i === cur ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';

  return h;
}

function renderSidebar() {
  const sb = $('#sidebar');
  const menu = MENUS[state.tab] || [];
  function isActive(path) {
    if (state.route === path) return true;
    if (path === '#/service/product' && (state.route === '#/service/product/detail' || state.route === '#/service/product/order')) return true;
    if (path === '#/service/mydemand/compute' && state.route.indexOf('#/service/mydemand/compute') === 0) return true;
    if (path === '#/service/mydemand/runtime' && state.route.indexOf('#/service/mydemand/runtime') === 0) return true;
    if (path === '#/service/model' && state.route.indexOf('#/service/model') === 0) return true;
    if (path === '#/service/case' && state.route.indexOf('#/service/case') === 0) return true;
    return false;
  }
  sb.innerHTML = menu.map(function(g) {
    if (g.children) {
      return '<div class="sidebar__group-title">' + g.label + '</div><div class="sidebar__sub">' + g.children.map(function(c) {
        return '<div class="sidebar__item' + (isActive(c.path)?' active':'') + '" data-go="' + c.path + '">' + c.label + '</div>';
      }).join('') + '</div>';
    }
    return '<div class="sidebar__item' + (isActive(g.path)?' active':'') + '" data-go="' + g.path + '">' + (g.icon||'') + ' ' + g.label + '</div>';
  }).join('');
}

function stopBannerTimer() {
  if (bannerTimer) { clearInterval(bannerTimer); bannerTimer = null; }
}
function startBannerTimer() {
  stopBannerTimer();
  if (state.route !== '#/home') return;
  bannerTimer = setInterval(function() {
    state.bannerIdx = (state.bannerIdx + 1) % 3;
    var track = $('#bannerTrack');
    if (track) {
      track.style.transform = 'translateX(-' + (state.bannerIdx * 100) + '%)';
      $$('.home-banner__dot').forEach(function(d, i){ d.classList.toggle('active', i === state.bannerIdx); });
    }
  }, 4500);
}

function renderPage() {
  const route = state.route;
  const fn = PAGES[route];
  stopBannerTimer();
  if (AUTH_ROUTES.includes(route)) {
    $('#authShell').classList.remove('hidden');
    $('#mainShell').classList.add('hidden');
    $('#authShell').innerHTML = fn ? fn() : '';
  } else {
    $('#authShell').classList.add('hidden');
    $('#mainShell').classList.remove('hidden');
    renderHeader();
    var layout = $('#layout');
    var isHome = route === '#/home';
    layout.className = 'layout' + (isHome ? ' layout--no-sidebar layout--home' : '');
    if (isHome) {
      $('#sidebar').classList.add('hidden');
      $('#sidebar').innerHTML = '';
    } else {
      $('#sidebar').classList.remove('hidden');
      renderSidebar();
    }
    $('#content').innerHTML = fn ? fn() : '<div class="empty"><div class="empty__icon">📄</div><p>页面未找到：' + route + '</p></div>';
    if (isHome) startBannerTimer();
  }
  renderProtoNav();
  bindPageEvents();
}

function bindPageEvents() {
  const loginBtn = $('#btnLogin');
  if (loginBtn) loginBtn.onclick = function() { state.loggedIn = true; toast('登录成功'); navigate('#/home'); };

  const searchInput = $('#searchInput');
  const searchDrop = $('#searchDrop');
  if (searchInput) {
    searchInput.onfocus = function() { searchDrop.classList.add('open'); };
    searchInput.onblur = function() { setTimeout(function(){ searchDrop.classList.remove('open'); }, 200); };
  }
  const userBtn = $('#userMenuBtn');
  const userMenu = $('#userMenu');
  if (userBtn) userBtn.onclick = function(e) { e.stopPropagation(); userMenu.classList.toggle('open'); };
}

document.addEventListener('click', function(e) {
  var el = e.target.closest('[data-go]');
  if (el) { e.preventDefault(); navigate(el.dataset.go); return; }
  el = e.target.closest('[data-tab]');
  if (el) { var tab = el.dataset.tab; var def = TABS.find(function(t){ return t.id===tab; }); if (def) navigate(def.def); return; }
  el = e.target.closest('[data-act]');
  if (el) { e.preventDefault(); handleAction(el.dataset.act, el); return; }
  el = e.target.closest('[data-page]');
  if (el) {
    var pager = el.closest('[data-pager]');
    if (pager) { var pid = pager.dataset.pager; state.pager[pid] = parseInt(el.dataset.page); renderPage(); toast('已切换到第 ' + el.dataset.page + ' 页'); }
    return;
  }
  if (!$('#userMenuBtn') || !$('#userMenuBtn').contains(e.target)) { var um = $('#userMenu'); if (um) um.classList.remove('open'); }
});

$('#protoNavBtn').onclick = function(e) { e.stopPropagation(); $('#protoNavPanel').classList.toggle('open'); };
document.addEventListener('click', function() { $('#protoNavPanel').classList.remove('open'); });

window.addEventListener('hashchange', function() {
  var hash = location.hash || '#/login';
  var next = hash.split('?')[0];
  if (next === '#/service/product/order' && state.route !== '#/service/product/order') {
    state.orderStep = 0;
  }
  state.route = next;
  state.tab = getTabForRoute(state.route) || state.tab;
  renderPage();
});

(function init() {
  if (!location.hash) location.hash = '#/login';
  else window.dispatchEvent(new Event('hashchange'));
})();
